name: War Thunder News Parser

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run parser
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python parser.py

      - name: Save state
        run: |
          git config --global user.name "War Thunder News Bot"
          git config --global user.email "actions@github.com"

          git add data/sent_news.json

          git diff --cached --quiet || git commit -m "Update news state"

          git push