name: War Thunder News Parser

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run parser
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python parser.py

      - name: Save sent news
        run: |
          echo "Проверяем состояние..."

          if [ ! -f data/sent_news.json ]; then
            echo "ОШИБКА: data/sent_news.json не создан!"
            exit 1
          fi

          cat data/sent_news.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent_news.json

          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi

          git commit -m "Update sent news state"

          git pull --rebase origin main

          git push origin main